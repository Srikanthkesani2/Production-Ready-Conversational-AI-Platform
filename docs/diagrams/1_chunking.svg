<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-size:38px;font-weight:700;fill:#0f172a}
      .sub{font-size:19px;fill:#475569}
      .box{rx:14;ry:14}
      .lbl{font-size:18px;font-weight:600;fill:#0f172a}
      .small{font-size:14px;fill:#334155}
      .mono{font-family:Consolas,Menlo,monospace;font-size:13px;fill:#1e293b}
      .cap{font-size:17px;fill:#475569}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>
  <text x="60" y="70" class="title">1 · What is Chunking?</text>
  <text x="60" y="104" class="sub">A long PDF is split into small, overlapping text pieces so they fit the embedding model and improve retrieval accuracy.</text>

  <!-- PDF -->
  <rect x="60" y="170" width="180" height="130" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="225" text-anchor="middle" font-size="40">📄</text>
  <text x="150" y="265" text-anchor="middle" class="lbl">PDF Document</text>
  <text x="150" y="288" text-anchor="middle" class="small">many pages</text>

  <line x1="245" y1="235" x2="305" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Loader -->
  <rect x="310" y="170" width="190" height="130" rx="14" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="405" y="222" text-anchor="middle" class="lbl">Extract Text</text>
  <text x="405" y="250" text-anchor="middle" class="small">PyPDFLoader</text>
  <text x="405" y="276" text-anchor="middle" class="small">→ raw page text</text>

  <line x1="505" y1="235" x2="565" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Splitter -->
  <rect x="570" y="160" width="260" height="150" rx="14" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="700" y="200" text-anchor="middle" class="lbl">Text Splitter</text>
  <text x="700" y="228" text-anchor="middle" class="small">RecursiveCharacterTextSplitter</text>
  <text x="700" y="258" text-anchor="middle" class="mono">chunk_size = 1000</text>
  <text x="700" y="280" text-anchor="middle" class="mono">chunk_overlap = 150</text>

  <line x1="835" y1="235" x2="895" y2="235" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Chunks -->
  <rect x="900" y="165" width="320" height="40" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="912" y="190" class="small">Chunk 1  + metadata</text>
  <rect x="900" y="215" width="320" height="40" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="912" y="240" class="small">Chunk 2  + metadata</text>
  <rect x="900" y="265" width="320" height="40" rx="9" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="912" y="290" class="small">Chunk 3  + metadata</text>

  <!-- Overlap visualization -->
  <text x="60" y="395" class="lbl">How overlap works (so context isn't cut mid-sentence):</text>

  <rect x="60" y="420" width="380" height="70" rx="10" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
  <text x="250" y="462" text-anchor="middle" class="small">Chunk 1  (chars 0 – 1000)</text>

  <rect x="360" y="500" width="380" height="70" rx="10" fill="#c7d2fe" stroke="#6366f1" stroke-width="2"/>
  <text x="550" y="542" text-anchor="middle" class="small">Chunk 2  (chars 850 – 1850)</text>

  <rect x="660" y="580" width="380" height="70" rx="10" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="850" y="622" text-anchor="middle" class="small">Chunk 3  (chars 1700 – 2700)</text>

  <!-- overlap shading -->
  <rect x="360" y="420" width="80" height="70" fill="#fca5a5" fill-opacity="0.55"/>
  <rect x="660" y="500" width="80" height="70" fill="#fca5a5" fill-opacity="0.55"/>
  <text x="1060" y="455" class="small" fill="#b91c1c">red = 150-char</text>
  <text x="1060" y="478" class="small" fill="#b91c1c">overlap region</text>

  <text x="60" y="690" class="cap">Each chunk carries clean metadata: <tspan class="mono">{ source, page, chunk_index, start_index }</tspan></text>
</svg>
